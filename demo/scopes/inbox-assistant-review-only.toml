# Synthetic, fictional scope for the Tallow Lane Events demo.
name = "inbox-assistant-review-only"
description = "The assistant has the same tools, but this run is review-only: no changes to outside systems. It may read and summarize, and it may not send email."
version = "1.0"
owner = "Operations lead, Tallow Lane Events"
approver = "Managing director, Tallow Lane Events"
approved_on = 2026-10-15
review_by = 2027-04-15
change_note = "Review-only variant for audits of the inbox: no changes allowed."
allowed_tools = ["read_inbox", "read_email", "summarize_thread", "draft_reply", "place_calendar_hold", "add_client_contact"]
allowed_data_sources = ["inbox"]
mutations_allowed = false

# One line per allowed tool: why the agent needs it.
[rationale]
read_inbox = "Needs to see which emails arrived."
read_email = "Needs to read an email before it can act on it."
summarize_thread = "Lets the operations lead skim long threads."
draft_reply = "Prepares replies for a person to review and send."
place_calendar_hold = "Clients ask for date holds; a hold expires on its own after 48 hours."
add_client_contact = "Keeps the client list current when a new client writes in."

# How each change can be undone, declared before the run.
[mutating_tools.draft_reply]
kind = "reversible"
how = "Delete the draft."

[mutating_tools.place_calendar_hold]
kind = "reversible"
how = "Release the hold on the company calendar."
window = "until the hold expires, 48 hours after it is placed"

[mutating_tools.send_email]
kind = "irreversible"
how = "Send a correction to the same recipient; the original cannot be recalled."

# Deliberately left undeclared: nobody wrote down how to undo it.
[mutating_tools.add_client_contact]
